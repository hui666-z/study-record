<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 移动端自适应标签 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {# Jinja2 模板三元逻辑：如果后端传入title变量就使用，默认显示「错误页面」 #}
    <title>{{ title or '错误页面' }}</title>
    <!-- 引入 Bootstrap5 在线CSS样式 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<!-- bg-light：页面背景浅灰色 -->
<body class="bg-light">
    <div class="container mt-5 text-center">
        <!-- flex居中布局 -->
        <div class="row justify-content-center">
            <!-- 响应式宽度：中等屏幕占6列，大屏占4列 -->
            <div class="col-md-6 col-lg-4">
                <h1 class="display-1 text-danger fw-bold">404</h1>
                {# 页面标题，变量兜底默认文字 #}
                <h2 class="mt-3">{{ title or '页面未找到' }}</h2>
                <p class="text-muted mt-3">
                    {{ description or '您访问的页面不存在。' }}
                </p>
                <hr>
                <p>
                    <a href="/" class="btn btn-primary btn-lg">
                        <i class="bi bi-house-door"></i> 返回首页
                    </a>
                </p>
                <p class="small text-secondary mt-4">
                    {# request.path 内置变量，获取当前浏览器访问的url路径，Flask全局可用 #}
                    请求路径：{{ request.path }}
                </p>
            </div>
        </div>
    </div>

    <!-- Bootstrap5 JS，提供弹窗、组件交互功能 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
